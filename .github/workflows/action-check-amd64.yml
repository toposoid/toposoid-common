name: Unit Test
on:
  workflow_call:
env:
  PJ_ACTOR: toposoid
  PJ_REPO: toposoid-common
  PJ_BRANCH: feature
  PJ_VERSION: 0.7-SNAPSHOT
jobs:
  unit-test_toposoid-common:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone ${{ env.PJ_REPO }}
        uses: actions/checkout@v4
        with:
            repository: ${{ env.PJ_ACTOR }}/${{ env.PJ_REPO }}
      - name: Execute tests
        run: |
            cd ${GITHUB_WORKSPACE} && cd ../
            cd ./${{ env.PJ_REPO }}
            docker build --build-arg TARGET_BRANCH=${{ env.PJ_BRANCH }} --tag ${{ env.PJ_REPO }}:${{ env.PJ_VERSION }} -f Dockerfile-workflow .
            docker run --name ${{ env.PJ_REPO }} --detach -e TOPOSOID_AKKA_TOKEN=${{secrets.AKKA_TOKEN}} -i ${{ env.PJ_REPO }}:${{ env.PJ_VERSION }} /bin/bash        
            docker exec -t ${{ env.PJ_REPO }} bash -c "cd ${{ env.PJ_REPO }} && sbt headerCheck"
            docker exec -t ${{ env.PJ_REPO }} bash -c "cd ${{ env.PJ_REPO }} && sbt test:headerCheck"
            docker exec -t ${{ env.PJ_REPO }} bash -c "cd ${{ env.PJ_REPO }} && sbt compile"
            docker exec -t ${{ env.PJ_REPO }} bash -c "cd ${{ env.PJ_REPO }} && sbt test"
